[project]
name = "agentpay"
version = "0.1.0"
description = "Pay-per-request payments for AI agents with signed USDC vouchers"
requires-python = ">=3.10"
dependencies = ["web3>=7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agentpay-server = "agentpay.server:main"
agentpay-demo = "agentpay.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
